    // Remove the defaults
    DataTable.defaults.layout = {
        topStart: null,

    function arrayToTable(tableData) {
        var table = $('<table id="interactiveTable" class="display dataTable" style="width:100%"></table>');
        $(tableData).each(function (i, rowData) {
            if (i == 0) {
                var thead = $('<thead></thead>');
                var headerRow = $('<tr></tr>');
                $(rowData).each(function (j, cellData) {
                    headerRow.append($('<th>'+cellData+'</th>'));
                });
                thead.append(headerRow);
                table.append(thead);
                return;
            }
            else {
                var tbody = table.find('tbody');
                if (tbody.length == 0) {
                    tbody = $('<tbody></tbody>');
                    table.append(tbody);
                }
                if (rowData.length != tableData[0].length) {
                    console.log('skip row', i, 'with length', rowData.length);
                    return;
                }
                var row = $('<tr></tr>');
                $(rowData).each(function (j, cellData) {
                    row.append($('<td>'+cellData+'</td>'));
                });
                table.append(row);
            }
            
        });
        return table;
    }
